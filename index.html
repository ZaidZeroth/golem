<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#151820">
    <title>MANX MUDMEN - Hop Tu Naa Hackathon</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@700;800&family=Creepster&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="app.js" defer></script>
  </head>
  <body>
    <main class="page-shell">
      <section class="workbench" aria-label="MANX MUDMEN - Hop Tu Naa Hackathon game world and selected clod">
        <div class="map-board">
          <canvas id="map-canvas" aria-label="MANX MUDMEN - Hop Tu Naa Hackathon game world with draggable clay elements; drop a world clod in the top element panel to discard it" tabindex="0">
            This prototype needs a browser with canvas support.
          </canvas>
          <div class="visually-hidden-game-controls">
            <h1>MANX MUDMEN - Hop Tu Naa Hackathon</h1>
            <div id="element-bank" aria-label="Base word elements"></div>
          </div>
        </div>

        <aside class="detail-panel" aria-label="Selected clod information">
          <div id="detail-content" class="detail-content" aria-live="polite">
            <p class="detail-placeholder">No clod selected.</p>
          </div>
        </aside>
      </section>

      <p id="status" class="status" role="status" aria-live="polite">Drag a bank element directly onto a world clod to combine, or drop it in open garden to add a copy.</p>

      <section class="coming-soon-panel" aria-labelledby="coming-soon-heading">
        <h2 id="coming-soon-heading">Coming soon</h2>
        <ul class="coming-soon-elements" aria-label="Elements not yet available in the game">
          <li>and</li>
          <li>or</li>
          <li>in</li>
          <li>me</li>
          <li>fit</li>
          <li>combine</li>
          <li>split</li>
        </ul>
      </section>

    </main>
  </body>
</html>
