<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#151820">
    <title>GOLEM</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@700;800&family=Creepster&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="app.js" defer></script>
  </head>
  <body>
    <main class="page-shell">
      <header class="page-header">
        <h1>GOLEM</h1>
        <button class="reset-button" id="reset-button" type="button">Reset</button>
      </header>

      <section class="workbench" aria-label="Golem world and selected block">
        <section class="element-bank" aria-labelledby="element-bank-title">
          <h2 id="element-bank-title">Elements</h2>
          <div id="element-bank" class="element-bank-grid" aria-label="Base word elements"></div>
        </section>
        <div class="map-board">
          <canvas id="map-canvas" aria-label="Game world showing draggable word blocks" tabindex="0">
            This prototype needs a browser with canvas support.
          </canvas>
        </div>

        <aside class="detail-panel" aria-label="Selected block information">
          <div id="detail-content" class="detail-content" aria-live="polite">
            <p class="detail-placeholder">No block selected.</p>
          </div>
        </aside>
      </section>

      <p id="status" class="status" role="status" aria-live="polite">Choose a block or combine two blocks.</p>

    </main>
  </body>
</html>
